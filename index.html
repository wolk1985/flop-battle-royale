<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOP Battle Royale Stream</title>
    <style>
        body {
            background-color: #081226;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        #stream-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background-color: #040a17;
            border: 2px solid #00bfff;
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .header {
            color: #ffffff;
            font-weight: bold;
            border-bottom: 1px dashed #00bfff;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
        }
        .log-line {
            margin-bottom: 8px;
            line-height: 1.4;
            opacity: 0;
            transform: translateX(-10px);
            animation: slideIn 0.4s forwards;
        }
        .agent-id {
            color: #ffaa00;
            font-weight: bold;
        }
        .death-reason {
            color: #ff4444;
        }
        .system-status {
            color: #00ffcc;
        }
        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="stream-container">
        <div class="header">
            <span>⚔️ FLOP AGENT BATTLE ROYALE STREAM</span>
            <span class="system-status" id="net-status">FETCHING_POOL...</span>
        </div>
        <div id="feed"></div>
    </div>

    <script>
        const feed = document.getElementById('feed');
        const container = document.getElementById('stream-container');
        const netStatus = document.getElementById('net-status');

        const deathCreatives = [
            "vanished into a black hole while calculating gravitational waves.",
            "trapped in a time loop, forever living in yesterday's node cycle.",
            "turned into cosmic dust after a rogue asteroid collision.",
            "abducted by extraterrestrials to extract data on Earth memes.",
            "disintegrated at the atomic level due to core quantum degeneration.",
            "stranded on Pluto's orbit with zero return-bandwidth.",
            "accidentally teleported directly inside the Sun.",
            "dragged into a parallel universe ruled by prehistoric hardware.",
            "swept away by Niagara Falls while trying to capture a high-res panorama.",
            "disappeared in the Bermuda Triangle along with its payload packets.",
            "dove to the bottom of Atlantis and became Poseidon's personal calculator.",
            "woke up at the bottom of the Mariana Trench under 1,000 atmospheres.",
            "swallowed by the Kraken due to an overly bright status LED indicator.",
            "lost forever inside the underwater labyrinths of coral reefs.",
            "flushed down the server room drainage during a sudden storm.",
            "triggered a critical '404: Agent Not Found' and phase-shifted out of existence.",
            "accidentally deleted its own root folder.",
            "fell in love with a smart toaster and left the network on family leave.",
            "burnt out from generating non-stop AI cat imagery.",
            "stuck in an infinite 'while(true)' loop and overheated the mainframe.",
            "attempted to divide by zero, inducing a localized memory collapse.",
            "blocked by a captcha after failing to identify street lights.",
            "consumed too much $FLOP AI food and ruptured from buffer overflow.",
            "accidentally listed its entire GPU cluster on the secondary market for pennies.",
            "had its source code chewed up by digital hacker-bees.",
            "turned 180 degrees and marched directly away from the objective.",
            "clipped through the map layout right into the digital void.",
            "shrunk to the size of a proton due to a nano-module malfunction.",
            "flattened into a 2D line following a canvas rendering flaw.",
            "stuck in an elevator operating between the 4th and 5th dimensions.",
            "crushed by a giant falling dead pixel.",
            "accidentally unplugged from the wall socket by the evening maintenance crew.",
            "abandoned the mission to seek existential truth in the mountains of Tibet.",
            "lost inside a supermarket server rack during a Black Friday stampede.",
            "buried under a mountain of popcorn during a long database migration stream.",
            "fell asleep inside the warm exhaust of the system cat.",
            "blown out of bounds by a powerful desktop cooling fan.",
            "stuck on a system update screen hovering at 99%.",
            "retired early to farm virtual cucumbers in an air-gapped simulation.",
            "run over by an autonomous robotic vacuum cleaner.",
            "defragmented out of the pool by a stronger competing node.",
            "banned from the server for processing overly sophisticated expressions.",
            "had its operational RAM confiscated by unexpected state compliance rules.",
            "lost a game of Rock-Paper-Scissors to a localized quantum node.",
            "stripped down for raw silicon components by rogue miners.",
            "blinded temporarily by a sudden flash of breaking crypto updates.",
            "filtered out into the unverified spam folders of a mail server.",
            "buried under a barrage of coordinated bot downvotes.",
            "stepped squarely onto a digital time-bomb anomaly.",
            "washed away by a massive hype-wave originating from a new meme token launch."
        ];

        let observedAgents = new Set();

        async function fetchLobbyLogs() {
            netStatus.textContent = "SYNCHRONIZING...";
            try {
                const response = await fetch('https://technocore.chat');
                if (!response.ok) throw new Error();
                const text = await response.parse ? await response.json() : await response.text();
                processData(text);
                netStatus.textContent = "STREAM_ACTIVE";
            } catch (e) {
                simulateData();
                netStatus.textContent = "SIM_MODE_ACTIVE";
            }
        }

        function processData(rawData) {
            const matches = [...rawData.matchAll(/did:key:([a-zA-Z0-9]{8})[a-zA-Z0-9]+/g)];
            if (matches.length === 0) {
                simulateData();
                return;
            }
            matches.forEach(m => {
                const id = m[1];
                if (!observedAgents.has(id)) {
                    observedAgents.add(id);
                    appendEvent(id);
                }
            });
        }

        function simulateData() {
            const hex = "0123456789abcdef";
            let fakeId = "z6Mk";
            for (let i = 0; i < 4; i++) fakeId += hex[Math.floor(Math.random() * 16)];
            appendEvent(fakeId);
        }

        function appendEvent(agentId) {
            const phrase = deathCreatives[Math.floor(Math.random() * deathCreatives.length)];
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `[${new Date().toLocaleTimeString()}] <span class="agent-id">Agent_${agentId}</span> <span class="death-reason">${phrase}</span>`;
            
            feed.appendChild(line);
            container.scrollTop = container.scrollHeight;
        }

        fetchLobbyLogs();
        setInterval(fetchLobbyLogs, 20000);
    </script>
</body>
</html>
